name: Contract tests
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@77b0157695fb80e4d97c3ac4819c2d1db7ba96c7 # main
    with:
      force-full: false
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test parsers in an isolated environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Unit tests (no secrets, no live services, no deployment)
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Python syntax
        run: python3 -m compileall -q scripts tests custom_components
      - name: Diagram XML
        run: python3 scripts/build_diagrams.py --check
      - name: Test documentation-scope gate contracts
        run: python3 .github/workflow-tests/test_docs_scope.py
  home-assistant-runtime:
    needs: ["scope"]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements-runtime.txt, requirements-runtime-2026.10.0.txt]
    steps:
      - name: Require successful change classification
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['scope']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name == 'scope' else 'skipped'
              if value['result'] != wanted:
                  raise SystemExit(f'Unexpected validation result: {name}={value["result"]}, expected {wanted}')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.7'
      - name: Install pinned Home Assistant runtime in an isolated environment
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: |
          python -m venv .local/runtime-venv
          .local/runtime-venv/bin/python -m pip install --disable-pip-version-check -r "${{ matrix.requirements }}"
      - name: Download and verify pinned integration (staging only)
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: python scripts/stage_integration.py --stage .local/runtime-upstream
      - name: Exercise real HA schemas and registry with modeled AMI
        if: ${{ needs.scope.outputs.run == 'true' }}
        env:
          ASTERISK_UPSTREAM_ROOT: ${{ github.workspace }}/.local/runtime-upstream
        run: |
          .local/runtime-venv/bin/python -c "import sys; sys.path.insert(0, 'tests'); from test_upstream_runtime import RUNTIME_READY; assert RUNTIME_READY, 'Runtime suite must not skip in this job'"
          .local/runtime-venv/bin/python -m unittest discover -s tests -p test_upstream_runtime.py -v
          .local/runtime-venv/bin/python -m unittest discover -s tests -p test_phone_controls_runtime.py -v
          .local/runtime-venv/bin/python -m unittest discover -s tests -p test_phone_media_runtime.py -v
          .local/runtime-venv/bin/python -m unittest discover -s tests -p test_full_media_runtime.py -v
          .local/runtime-venv/bin/python -m unittest discover -s tests -p test_hardware_volume.py -v
          .local/runtime-venv/bin/python -m unittest discover -s tests -p test_hands_free_runtime.py -v
          .local/runtime-venv/bin/python -m unittest discover -s tests -p 'test_schedule_*.py' -v
