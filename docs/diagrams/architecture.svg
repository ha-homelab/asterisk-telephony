<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">Asterisk and Home Assistant</title><desc id="desc">Two independent paths for AMI monitoring and SIP audio to Assist.</desc><defs><marker id="arrow-48ddcc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48ddcc"/></marker><marker id="arrow-ff836d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#ff836d"/></marker><marker id="arrow-f7cb64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#f7cb64"/></marker></defs><rect width="1280" height="760" fill="#101c34"/><text x="50" y="65" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="38" text-anchor="start"><tspan x="50" dy="0">Asterisk and Home Assistant</tspan></text><rect x="50" y="300" width="310" height="125" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="205.0" y="355.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="205.0" dy="0">Cisco SIP phones</tspan><tspan x="205.0" dy="31.05">G.711 ulaw / alaw</tspan></text><rect x="475" y="300" width="310" height="125" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="630.0" y="340.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="630.0" dy="0">Asterisk / PJSIP</tspan><tspan x="630.0" dy="31.05">phone registration</tspan><tspan x="630.0" dy="31.05">call routing + codec</tspan></text><rect x="900" y="130" width="310" height="125" rx="12" fill="#172841" stroke="#f7cb64" stroke-width="2"/><text x="1055.0" y="170.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="1055.0" dy="0">Home Assistant</tspan><tspan x="1055.0" dy="31.05">custom integration</tspan><tspan x="1055.0" dy="31.05">AMI monitoring / actions</tspan></text><rect x="900" y="470" width="310" height="125" rx="12" fill="#172841" stroke="#ff836d" stroke-width="2"/><text x="1055.0" y="510.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="1055.0" dy="0">Home Assistant VoIP</tspan><tspan x="1055.0" dy="31.05">Assist pipeline</tspan><tspan x="1055.0" dy="31.05">Opus media</tspan></text><path d="M360,360 L475,360" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)" marker-start="url(#arrow-48ddcc)"/><text x="420" y="330" fill="#48ddcc" font-family="Arial,sans-serif" font-size="19" text-anchor="middle"><tspan x="420" dy="0">SIP + RTP</tspan></text><path d="M785,330 L900,225" fill="none" stroke="#f7cb64" stroke-width="3" marker-end="url(#arrow-f7cb64)" marker-start="url(#arrow-f7cb64)"/><text x="810" y="185" fill="#f7cb64" font-family="Arial,sans-serif" font-size="19" text-anchor="middle"><tspan x="810" dy="0">AMI TCP 5038</tspan></text><text x="805" y="214" fill="#f7cb64" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><tspan x="805" dy="0">HA opens connection</tspan></text><path d="M785,400 L900,525" fill="none" stroke="#ff836d" stroke-width="3" marker-end="url(#arrow-ff836d)" marker-start="url(#arrow-ff836d)"/><text x="810" y="585" fill="#ff836d" font-family="Arial,sans-serif" font-size="19" text-anchor="middle"><tspan x="810" dy="0">SIP UDP + RTP</tspan></text><text x="50" y="695" fill="#aab9d0" font-family="Arial,sans-serif" font-size="22" text-anchor="start"><tspan x="50" dy="0">Separate paths: AMI carries control and state. Assist requires working audio transcoding.</tspan></text></svg>
