<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">Installation and verification</title><desc id="desc">Verify upstream software, stage locally, install explicitly, map real entities, then test.</desc><defs><marker id="arrow-48ddcc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48ddcc"/></marker><marker id="arrow-ff836d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#ff836d"/></marker><marker id="arrow-f7cb64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#f7cb64"/></marker></defs><rect width="1280" height="760" fill="#101c34"/><text x="50" y="65" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="38" text-anchor="start"><tspan x="50" dy="0">Installation and verification</tspan></text><rect x="50" y="180" width="310" height="125" rx="12" fill="#172841" stroke="#f7cb64" stroke-width="2"/><text x="205.0" y="235.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="205.0" dy="0">Pinned upstream ZIP</tspan><tspan x="205.0" dy="31.05">commit + SHA-256</tspan></text><rect x="485" y="180" width="310" height="125" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="640.0" y="235.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="640.0" dy="0">Local verification</tspan><tspan x="640.0" dy="31.05">archive safety checks</tspan></text><rect x="920" y="180" width="310" height="125" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="1075.0" y="235.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="1075.0" dy="0">Staged component</tspan><tspan x="1075.0" dy="31.05">no HA changes</tspan></text><path d="M360,240 L485,240" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><path d="M795,240 L920,240" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><rect x="920" y="430" width="310" height="125" rx="12" fill="#172841" stroke="#ff836d" stroke-width="2"/><text x="1075.0" y="485.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="1075.0" dy="0">Explicit install</tspan><tspan x="1075.0" dy="31.05">backup + config check</tspan></text><rect x="485" y="430" width="310" height="125" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="640.0" y="485.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="640.0" dy="0">Map real entity IDs</tspan><tspan x="640.0" dy="31.05">render package / dashboard</tspan></text><rect x="50" y="430" width="310" height="125" rx="12" fill="#172841" stroke="#f7cb64" stroke-width="2"/><text x="205.0" y="485.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="205.0" dy="0">Acceptance tests</tspan><tspan x="205.0" dy="31.05">phone pair + DTMF</tspan></text><path d="M1075,305 L1075,430" fill="none" stroke="#ff836d" stroke-width="3" marker-end="url(#arrow-ff836d)"/><path d="M920,490 L795,490" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><path d="M485,490 L360,490" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><text x="50" y="695" fill="#aab9d0" font-family="Arial,sans-serif" font-size="21" text-anchor="start"><tspan x="50" dy="0">HACS is an alternative installer. Do not let HACS and this staging tool manage the same directory.</tspan></text></svg>
