<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Cisco radio playback through Home Assistant</title>
  <desc id="desc">One media player per physical handset uses an allowed radio service through the existing gateway and Asterisk. Playing requires the identified radio call and matching Up AudioSocket path; Stop targets only that radio call. Offline phones remain in the inventory and do not automatically replay. Verify actual media state and audible playback after installation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c34"/><stop offset="1" stop-color="#162d43"/></linearGradient>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55e0ce"/></marker>
    <marker id="goldArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5cc79"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #f3f7fc; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 17px; }
      .muted { fill: #b9c9dd; }
      .card { fill: #1b304c; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="820" rx="16" fill="url(#background)"/>
  <text x="48" y="66" font-size="38" font-weight="700">Radio, one handset at a time</text>
  <text x="48" y="103" class="body muted">An extension of the existing Cisco phone controls integration</text>
  <rect x="48" y="126" width="574" height="34" rx="17" fill="#453a27"/>
  <text x="65" y="149" class="small" style="fill:#ffe0a2">SETUP · Verify state and playback after updating</text>

  <rect x="48" y="202" width="330" height="248" rx="16" class="card" stroke="#55e0ce"/>
  <rect x="70" y="224" width="44" height="44" rx="12" fill="#55e0ce"/>
  <path d="M80 244L92 234L104 244V259H96V250H88V259H80Z" fill="#102b33"/>
  <text x="128" y="254" class="heading">Home Assistant</text>
  <text x="72" y="299" class="body">One player per handset</text>
  <text x="72" y="335" class="body muted">Choose from source_list</text>
  <text x="72" y="368" class="body muted">or play service “708”</text>
  <text x="72" y="414" class="small" style="fill:#55e0ce">Example service · no arbitrary URLs</text>

  <rect x="475" y="202" width="330" height="248" rx="16" class="card" stroke="#f5cc79"/>
  <text x="499" y="250" class="heading">Gateway + Asterisk</text>
  <text x="499" y="299" class="body">Curated radio catalog</text>
  <text x="499" y="335" class="body muted">Allowlist + call admission</text>
  <text x="499" y="368" class="body muted">PBX radio + AudioSocket</text>
  <text x="499" y="414" class="small" style="fill:#f5cc79">Track the exact call identity</text>

  <rect x="902" y="202" width="330" height="248" rx="16" class="card" stroke="#ff9b86"/>
  <text x="926" y="250" class="heading">Cisco handset</text>
  <text x="926" y="299" class="body">One physical speaker</text>
  <text x="926" y="335" class="body muted">Sibling lines, one device</text>
  <text x="926" y="368" class="body muted">Radio arrives as a call</text>
  <text x="926" y="414" class="small" style="fill:#ffb29f">Confirm audible sound separately</text>

  <path d="M378 315H463" stroke="#55e0ce" stroke-width="3" marker-end="url(#tealArrow)"/>
  <text x="425" y="290" text-anchor="middle" class="small" style="fill:#55e0ce">Control</text>
  <path d="M805 315H890" stroke="#f5cc79" stroke-width="3" marker-end="url(#goldArrow)"/>
  <text x="852" y="290" text-anchor="middle" class="small" style="fill:#f5cc79">SIP audio</text>

  <rect x="48" y="490" width="1184" height="130" rx="16" fill="#173d44" stroke="#55e0ce"/>
  <text x="72" y="527" class="heading">Observe before reporting Playing</text>
  <text x="72" y="562" class="body">Identified PBX radio call + matching Up AudioSocket path</text>
  <text x="72" y="595" class="body muted">Accepted request ≠ verified playback path ≠ human confirmation of sound</text>

  <rect x="48" y="648" width="571" height="126" rx="16" fill="#333448" stroke="#b9a5ff"/>
  <text x="72" y="685" class="heading">Stop, then change station</text>
  <text x="72" y="720" class="body muted">End only the exact observed radio call.</text>
  <text x="72" y="751" class="body muted">Never stop a replacement or unrelated call.</text>
  <rect x="645" y="648" width="587" height="126" rx="16" fill="#303743" stroke="#9cb4cf"/>
  <text x="669" y="685" class="heading">Keep offline phones in the inventory</text>
  <text x="669" y="720" class="body muted">Reconnection updates availability.</text>
  <text x="669" y="751" class="body muted">No automatic radio replay or queued request.</text>
</svg>
