<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">Phone controls, timers and alarms</title><desc id="desc">The Home Assistant client uses a private gateway for state-guarded phone actions, with persistent at-most-once schedules.</desc><defs><marker id="arrow-48ddcc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48ddcc"/></marker><marker id="arrow-ff836d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#ff836d"/></marker><marker id="arrow-f7cb64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#f7cb64"/></marker></defs><rect width="1280" height="760" fill="#101c34"/><text x="50" y="65" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="38" text-anchor="start"><tspan x="50" dy="0">Phone controls, timers and alarms</tspan></text><rect x="50" y="180" width="330" height="150" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="215.0" y="248.0" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="215.0" dy="0">Home Assistant UI</tspan><tspan x="215.0" dy="31.05">controls + schedules</tspan></text><rect x="475" y="180" width="330" height="150" rx="12" fill="#172841" stroke="#f7cb64" stroke-width="2"/><text x="640.0" y="248.0" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="640.0" dy="0">Private phone gateway</tspan><tspan x="640.0" dy="31.05">source + bearer checks</tspan></text><rect x="900" y="180" width="330" height="150" rx="12" fill="#172841" stroke="#ff836d" stroke-width="2"/><text x="1065.0" y="248.0" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="1065.0" dy="0">Cisco 7945G handset</tspan><tspan x="1065.0" dy="31.05">primary + secondary line</tspan></text><path d="M380,255 L475,255" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><text x="428" y="230" fill="#48ddcc" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><tspan x="428" dy="0">HTTP API</tspan></text><path d="M805,255 L900,255" fill="none" stroke="#ff836d" stroke-width="3" marker-end="url(#arrow-ff836d)"/><text x="852" y="230" fill="#ff836d" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><tspan x="852" dy="0">Cisco XML</tspan></text><rect x="50" y="445" width="330" height="150" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="215.0" y="498.0" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="215.0" dy="0">HA schedule storage</tspan><tspan x="215.0" dy="31.05">claim before sending</tspan><tspan x="215.0" dy="31.05">never replay missed alarms</tspan></text><rect x="475" y="445" width="330" height="150" rx="12" fill="#172841" stroke="#f7cb64" stroke-width="2"/><text x="640.0" y="498.0" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="640.0" dy="0">Asterisk AMI state</tspan><tspan x="640.0" dy="31.05">exact channel ownership</tspan><tspan x="640.0" dy="31.05">PBX DND + explicit alert stop</tspan></text><rect x="900" y="445" width="330" height="150" rx="12" fill="#172841" stroke="#ff836d" stroke-width="2"/><text x="1065.0" y="498.0" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="1065.0" dy="0">Private image folders</tspan><tspan x="1065.0" dy="31.05">local PNG / JPEG only</tspan><tspan x="1065.0" dy="31.05">no URL fetch or symlinks</tspan></text><path d="M215,330 L215,445" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><path d="M640,330 L640,445" fill="none" stroke="#f7cb64" stroke-width="3" marker-end="url(#arrow-f7cb64)" marker-start="url(#arrow-f7cb64)"/><text x="50" y="670" fill="#aab9d0" font-family="Arial,sans-serif" font-size="22" text-anchor="start"><tspan x="50" dy="0">Existing SIP audio, Asterisk entities and native Assist pipelines remain independent.</tspan></text><text x="50" y="710" fill="#aab9d0" font-family="Arial,sans-serif" font-size="21" text-anchor="start"><tspan x="50" dy="0">Message inputs require actual Recorder exclusions. Secrets and household state stay private.</tspan></text></svg>
