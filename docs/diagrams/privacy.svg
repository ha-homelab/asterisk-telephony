<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">Data and trust boundaries</title><desc id="desc">Public source is separate from household state and AMI secrets.</desc><defs><marker id="arrow-48ddcc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48ddcc"/></marker><marker id="arrow-ff836d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#ff836d"/></marker><marker id="arrow-f7cb64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#f7cb64"/></marker></defs><rect width="1280" height="760" fill="#101c34"/><text x="50" y="65" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="38" text-anchor="start"><tspan x="50" dy="0">Data and trust boundaries</tspan></text><rect x="50" y="170" width="310" height="125" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="205.0" y="225.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="205.0" dy="0">Public repository</tspan><tspan x="205.0" dy="31.05">code, docs, fake examples</tspan></text><rect x="485" y="170" width="310" height="125" rx="12" fill="#172841" stroke="#f7cb64" stroke-width="2"/><text x="640.0" y="225.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="640.0" dy="0">Private local files</tspan><tspan x="640.0" dy="31.05">entity map, rendered YAML</tspan></text><rect x="920" y="170" width="310" height="125" rx="12" fill="#172841" stroke="#ff836d" stroke-width="2"/><text x="1075.0" y="225.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="1075.0" dy="0">HA config / .storage</tspan><tspan x="1075.0" dy="31.05">AMI secret and state</tspan></text><path d="M360,232 L485,232" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><path d="M795,232 L920,232" fill="none" stroke="#48ddcc" stroke-width="3" marker-end="url(#arrow-48ddcc)"/><rect x="150" y="435" width="410" height="125" rx="12" fill="#172841" stroke="#f7cb64" stroke-width="2"/><text x="355.0" y="475.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="355.0" dy="0">PBX firewall</tspan><tspan x="355.0" dy="31.05">allow only HA source /32</tspan><tspan x="355.0" dy="31.05">no public AMI</tspan></text><rect x="710" y="435" width="410" height="125" rx="12" fill="#172841" stroke="#48ddcc" stroke-width="2"/><text x="915.0" y="475.5" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><tspan x="915.0" dy="0">Recorder exclusions</tspan><tspan x="915.0" dy="31.05">call / DTMF entities</tspan><tspan x="915.0" dy="31.05">no history by default</tspan></text><text x="50" y="695" fill="#aab9d0" font-family="Arial,sans-serif" font-size="21" text-anchor="start"><tspan x="50" dy="0">An AMI account with write=system is privileged. Network limits and trusted HA users are required.</tspan></text></svg>
